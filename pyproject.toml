[project]
name = "saarthi-voice-loan-assistant"
version = "0.1.0"
description = "Doubt-aware, state-consistent voice assistant for a synthetic personal-loan pre-application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "geonamescache>=3.0.2",
    "groq>=0.31.0",
    "httpx>=0.28.0",
    "livekit-agents[rime]>=1.5,<2",
    "livekit-api>=1.0.7",
    "livekit-plugins-deepgram>=1.5,<2",
    "livekit-plugins-rime>=1.5,<2",
    "num2words>=0.5.14",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "qdrant-client[fastembed]>=1.15.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
saarthi-api = "saarthi.main:run_api"
saarthi-agent = "saarthi.agent.worker:run_worker"
saarthi-ingest = "saarthi.scripts.ingest_product_facts:main"
saarthi-compile-facts = "saarthi.scripts.compile_product_sheet:main"
saarthi-rime-preflight = "saarthi.scripts.preflight_rime:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saarthi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: uses local persistence or multiple components",
    "live: calls an external provider and consumes API quota",
    "manual: requires a human listener or browser interaction",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]
